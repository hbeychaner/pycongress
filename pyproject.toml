[project]
name = "pycongress"
version = "0.1.0"
description = "Python SDK for the Congress.gov API — typed client, Pydantic models, and endpoint specs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
services = [
    "openai>=1.0",
    "bs4>=0.0.2",
    "selenium>=4.0",
    "chromedriver-py>=130",
]
streamlit = [
    "streamlit>=1.30",
    "streamlit-agraph>=0.0.40",
    "plotly>=5.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["congress_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
